# ============================================================================
# DEMO / CI — CA HE THONG BANG MOT LENH:
#     python deploy/tao_env.py          # lan dau: sinh .env (mat khau ngau nhien, khong commit)
#     docker compose -f docker-compose.demo.yml up -d --build
#
# Tach han khoi moi truong dev (docker-compose.infra.yml + chay service tren may):
#   - project "datn-demo", container "datn-demo-*", volume rieng → khong dung DB dev;
#   - cong tren may LECH +10000 so voi dev → chay song song duoc:
#       gateway   http://localhost:18080        (API, Swagger cua tung service khong mo ra ngoai)
#       MinIO     http://localhost:19000 / console http://localhost:19001
#       Mailpit   http://localhost:18025        RabbitMQ http://localhost:25672
#       task / annotation / link / gate: 18103 / 18104 / 18107 / 18108 (de E2E goi thang)
#   - lan dau tu migrate + seed du lieu mau (tai khoan @crowd.local, mat khau Matkhau@123).
#
# Xoa sach du lieu demo: docker compose -f docker-compose.demo.yml down -v
# Mat khau DB / RabbitMQ / MinIO / khoa noi bo doc tu .env (S-08) — khong con trong repo.
# Khoa ky JWT: identity tu sinh lan dau, giu trong volume identity-keys (khong nam trong image).
# ============================================================================
name: datn-demo

x-dotnet-env: &dotnet-env
  ASPNETCORE_ENVIRONMENT: Development
  RabbitMq__Host: rabbitmq
  Auth__MetadataAddress: http://identity:8101/.well-known/openid-configuration
  ObjectStorage__ServiceUrl: http://minio:9000
  # Link xem / tai file ky bang dia chi trinh duyet toi duoc (xem ObjectStorageOptions.PublicUrl).
  ObjectStorage__PublicUrl: http://localhost:19000
  InternalApi__Key: ${INTERNAL_API_KEY:?chay python deploy/tao_env.py}
  # Mat khau ha tang lay tu .env (S-08) — ghi de gia tri dev trong appsettings.Development.json.
  RabbitMq__Password: ${RABBIT_PASSWORD:?chay python deploy/tao_env.py}
  ObjectStorage__SecretKey: ${MINIO_PASSWORD:?chay python deploy/tao_env.py}
  # Link xem mau qua media-svc (FP-03): khoa ma hoa token dung chung voi media-svc.
  MediaLinks__PublicUrl: http://localhost:18080
  MediaLinks__GrantKey: ${MEDIA_GRANT_KEY:?chay python deploy/tao_env.py}

x-dotnet-service: &dotnet-service
  restart: unless-stopped
  depends_on:
    rabbitmq: { condition: service_healthy }
    minio-init: { condition: service_completed_successfully }

x-postgres: &postgres
  image: postgres:16-alpine
  restart: unless-stopped

networks:
  default:
    # Subnet co dinh: gate / link chi tin X-Forwarded-For tu mang nay (ForwardedHeaders:TrustedNetworks).
    ipam:
      config:
        - subnet: 10.88.0.0/24

services:
  # ------------------------------------------------------------------ ha tang
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: datn-demo-rabbitmq
    environment: { RABBITMQ_DEFAULT_USER: datn, RABBITMQ_DEFAULT_PASS: "${RABBIT_PASSWORD:?chay python deploy/tao_env.py}" }
    ports: ["127.0.0.1:25672:15672"]
    volumes: [rabbitdata:/var/lib/rabbitmq]
    healthcheck: { test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"], interval: 10s, timeout: 5s, retries: 30 }

  minio:
    # MinIO da go image chinh thuc khoi ca Docker Hub lan quay.io (may moi keo ve bao "failed to resolve").
    # pgsty/minio: ban dung tu ma nguon MinIO do cong dong duy tri, van kem san mc. Ghim phien ban.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: datn-demo-minio
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: datn, MINIO_ROOT_PASSWORD: "${MINIO_PASSWORD:?chay python deploy/tao_env.py}" }
    ports: ["127.0.0.1:19000:9000", "127.0.0.1:19001:9001"]
    volumes: [miniodata:/data]
    healthcheck: { test: ["CMD", "mc", "ready", "local"], interval: 10s, timeout: 5s, retries: 30 }

  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: datn-demo-minio-init
    depends_on: { minio: { condition: service_healthy } }
    environment: { MINIO_PASSWORD: "${MINIO_PASSWORD:?chay python deploy/tao_env.py}" }
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 datn $${MINIO_PASSWORD} &&
      /usr/bin/mc mb -p local/datasets local/media local/exports local/kyb-docs local/avatars local/ml-models &&
      /usr/bin/mc anonymous set none local/datasets &&
      /usr/bin/mc anonymous set none local/media
      "

  mailpit:
    image: axllent/mailpit:latest
    container_name: datn-demo-mailpit
    ports: ["127.0.0.1:18025:8025"]

  redis-gate:
    image: redis:7-alpine
    container_name: datn-demo-redis-gate
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redis-gate-data:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }

  # Gateway: bo dem gioi han tan suat DUNG CHUNG giua cac instance (VD-S-12). Mat du lieu khong sao
  # (chi la bo dem 1 phut) nen khong bat appendonly.
  redis-gateway:
    image: redis:7-alpine
    container_name: datn-demo-redis-gateway
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }

  ch-gate:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: datn-demo-ch-gate
    environment:
      CLICKHOUSE_USER: gate_user
      CLICKHOUSE_PASSWORD: ${DB_GATE_PASSWORD:?chay python deploy/tao_env.py}
      CLICKHOUSE_DB: gate_db
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits: { nofile: { soft: 262144, hard: 262144 } }
    volumes: [ch-gate-data:/var/lib/clickhouse]
    healthcheck: { test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"], interval: 10s, timeout: 5s, retries: 30 }

  db-identity:
    <<: *postgres
    container_name: datn-demo-db-identity
    environment: { POSTGRES_USER: identity_user, POSTGRES_PASSWORD: "${DB_IDENTITY_PASSWORD:?chay python deploy/tao_env.py}", POSTGRES_DB: identity_db }
    volumes: [pgdata-identity:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U identity_user -d identity_db"], interval: 5s, timeout: 3s, retries: 30 }

  db-project:
    <<: *postgres
    container_name: datn-demo-db-project
    environment: { POSTGRES_USER: project_user, POSTGRES_PASSWORD: "${DB_PROJECT_PASSWORD:?chay python deploy/tao_env.py}", POSTGRES_DB: project_db }
    volumes: [pgdata-project:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U project_user -d project_db"], interval: 5s, timeout: 3s, retries: 30 }

  db-task:
    <<: *postgres
    container_name: datn-demo-db-task
    command: ["postgres", "-c", "max_connections=60", "-c", "shared_buffers=128MB"]
    environment: { POSTGRES_USER: task_user, POSTGRES_PASSWORD: "${DB_TASK_PASSWORD:?chay python deploy/tao_env.py}", POSTGRES_DB: task_db }
    volumes: [pgdata-task:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U task_user -d task_db"], interval: 5s, timeout: 3s, retries: 30 }

  db-annotation:
    <<: *postgres
    container_name: datn-demo-db-annotation
    command: ["postgres", "-c", "max_connections=60", "-c", "shared_buffers=128MB"]
    environment: { POSTGRES_USER: annotation_user, POSTGRES_PASSWORD: "${DB_ANNOTATION_PASSWORD:?chay python deploy/tao_env.py}", POSTGRES_DB: annotation_db }
    volumes: [pgdata-annotation:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U annotation_user -d annotation_db"], interval: 5s, timeout: 3s, retries: 30 }

  db-ledger:
    <<: *postgres
    container_name: datn-demo-db-ledger
    environment: { POSTGRES_USER: ledger_user, POSTGRES_PASSWORD: "${DB_LEDGER_PASSWORD:?chay python deploy/tao_env.py}", POSTGRES_DB: ledger_db }
    volumes: [pgdata-ledger:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ledger_user -d ledger_db"], interval: 5s, timeout: 3s, retries: 30 }

  db-payment:
    <<: *postgres
    container_name: datn-demo-db-payment
    environment: { POSTGRES_USER: payment_user, POSTGRES_PASSWORD: "${DB_PAYMENT_PASSWORD:?chay python deploy/tao_env.py}", POSTGRES_DB: payment_db }
    volumes: [pgdata-payment:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U payment_user -d payment_db"], interval: 5s, timeout: 3s, retries: 30 }

  db-link:
    <<: *postgres
    container_name: datn-demo-db-link
    environment: { POSTGRES_USER: link_user, POSTGRES_PASSWORD: "${DB_LINK_PASSWORD:?chay python deploy/tao_env.py}", POSTGRES_DB: link_db }
    volumes: [pgdata-link:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U link_user -d link_db"], interval: 5s, timeout: 3s, retries: 30 }

  db-gate:
    <<: *postgres
    container_name: datn-demo-db-gate
    environment: { POSTGRES_USER: gate_user, POSTGRES_PASSWORD: "${DB_GATE_PASSWORD:?chay python deploy/tao_env.py}", POSTGRES_DB: gate_db }
    volumes: [pgdata-gate:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U gate_user -d gate_db"], interval: 5s, timeout: 3s, retries: 30 }

  db-quality:
    <<: *postgres
    container_name: datn-demo-db-quality
    environment: { POSTGRES_USER: quality_user, POSTGRES_PASSWORD: "${DB_QUALITY_PASSWORD:?chay python deploy/tao_env.py}", POSTGRES_DB: quality_db }
    volumes: [pgdata-quality:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U quality_user -d quality_db"], interval: 5s, timeout: 3s, retries: 30 }

  db-ml:
    # pgvector: bo dem vector nhung cau cua ml-svc (kien truc 3.19).
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    container_name: datn-demo-db-ml
    environment: { POSTGRES_USER: ml_user, POSTGRES_PASSWORD: "${DB_ML_PASSWORD:?chay python deploy/tao_env.py}", POSTGRES_DB: ml_db }
    volumes: [pgdata-ml:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ml_user -d ml_db"], interval: 5s, timeout: 3s, retries: 30 }

  db-admin:
    <<: *postgres
    container_name: datn-demo-db-admin
    environment: { POSTGRES_USER: admin_user, POSTGRES_PASSWORD: "${DB_ADMIN_PASSWORD:?chay python deploy/tao_env.py}", POSTGRES_DB: admin_db }
    volumes: [pgdata-admin:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U admin_user -d admin_db"], interval: 5s, timeout: 3s, retries: 30 }

  db-notification:
    <<: *postgres
    container_name: datn-demo-db-notification
    environment: { POSTGRES_USER: notification_user, POSTGRES_PASSWORD: "${DB_NOTIFICATION_PASSWORD:?chay python deploy/tao_env.py}", POSTGRES_DB: notification_db }
    volumes: [pgdata-notification:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U notification_user -d notification_db"], interval: 5s, timeout: 3s, retries: 30 }

  # ------------------------------------------------------------------ service
  admin:
    <<: *dotnet-service
    image: datn/admin:demo
    container_name: datn-demo-admin
    build: { context: ., dockerfile: deploy/docker/dotnet.Dockerfile, args: { APP: Crowd.Admin.Api } }
    depends_on:
      rabbitmq: { condition: service_healthy }
      db-admin: { condition: service_healthy }
    environment:
      <<: *dotnet-env
      ASPNETCORE_URLS: http://+:8111
      ConnectionStrings__AdminDb: Host=db-admin;Port=5432;Database=admin_db;Username=admin_user;Password=${DB_ADMIN_PASSWORD:?chay python deploy/tao_env.py};Maximum Pool Size=10

  identity:
    <<: *dotnet-service
    image: datn/identity:demo
    container_name: datn-demo-identity
    build: { context: ., dockerfile: deploy/docker/dotnet.Dockerfile, args: { APP: Crowd.Identity.Api } }
    depends_on:
      rabbitmq: { condition: service_healthy }
      # Giay phep kinh doanh (KYB) luu o bucket kyb-docs do minio-init tao.
      minio-init: { condition: service_completed_successfully }
      db-identity: { condition: service_healthy }
    # Khoa ky token nam o volume rieng: tao lai container (up --build) KHONG doi khoa → nguoi dang
    # dang nhap khong bi da ra. Xoa sach (down -v) moi sinh khoa moi.
    volumes: [identity-keys:/app/secrets]
    environment:
      <<: *dotnet-env
      ASPNETCORE_URLS: http://+:8101
      ConnectionStrings__IdentityDb: Host=db-identity;Port=5432;Database=identity_db;Username=identity_user;Password=${DB_IDENTITY_PASSWORD:?chay python deploy/tao_env.py};Maximum Pool Size=10
      # Ma hoa bi mat 2FA (FC-04), bam co khoa so giay to tuy than (xac minh danh tinh).
      IdentityData__Key: ${IDENTITY_DATA_KEY:?chay python deploy/tao_env.py}

  notification:
    <<: *dotnet-service
    image: datn/notification:demo
    container_name: datn-demo-notification
    build: { context: ., dockerfile: deploy/docker/dotnet.Dockerfile, args: { APP: Crowd.Notification.Api } }
    depends_on:
      rabbitmq: { condition: service_healthy }
      db-notification: { condition: service_healthy }
      mailpit: { condition: service_started }
    environment:
      <<: *dotnet-env
      ASPNETCORE_URLS: http://+:8110
      ConnectionStrings__NotificationDb: Host=db-notification;Port=5432;Database=notification_db;Username=notification_user;Password=${DB_NOTIFICATION_PASSWORD:?chay python deploy/tao_env.py};Maximum Pool Size=10
      # Email thong bao gui qua Mailpit (xem tai http://localhost:18025).
      Smtp__Host: mailpit
      Smtp__Port: "1025"

  project:
    <<: *dotnet-service
    image: datn/project:demo
    container_name: datn-demo-project
    build: { context: ., dockerfile: deploy/docker/dotnet.Dockerfile, args: { APP: Crowd.Project.Api, FFMPEG: "true" } }
    depends_on:
      rabbitmq: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      db-project: { condition: service_healthy }
    environment:
      <<: *dotnet-env
      ASPNETCORE_URLS: http://+:8102
      ConnectionStrings__ProjectDb: Host=db-project;Port=5432;Database=project_db;Username=project_user;Password=${DB_PROJECT_PASSWORD:?chay python deploy/tao_env.py};Maximum Pool Size=10
      # FB-11: cho thu nhap tu S3 bang chinh MinIO cua stack (moi dia chi noi bo khac van bi chan — SSRF).
      DatasetImport__AllowedPrivateHosts__0: minio
      InternalApi__TaskUrl: http://task:8103
      InternalApi__AnnotationUrl: http://annotation:8104
      InternalApi__IdentityUrl: http://identity:8101

  task:
    <<: *dotnet-service
    image: datn/task:demo
    container_name: datn-demo-task
    build: { context: ., dockerfile: deploy/docker/dotnet.Dockerfile, args: { APP: Crowd.Tasking.Api } }
    depends_on:
      rabbitmq: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      db-task: { condition: service_healthy }
    ports: ["127.0.0.1:18103:8103"]
    environment:
      <<: *dotnet-env
      ASPNETCORE_URLS: http://+:8103
      ConnectionStrings__TaskDb: Host=db-task;Port=5432;Database=task_db;Username=task_user;Password=${DB_TASK_PASSWORD:?chay python deploy/tao_env.py};Maximum Pool Size=20
      # IP that cua labeler qua gateway (chong gian lan: nhieu tai khoan chung IP).
      ForwardedHeaders__TrustedNetworks__0: 10.88.0.0/24

  annotation:
    <<: *dotnet-service
    image: datn/annotation:demo
    container_name: datn-demo-annotation
    build: { context: ., dockerfile: deploy/docker/dotnet.Dockerfile, args: { APP: Crowd.Annotation.Api } }
    depends_on:
      rabbitmq: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      db-annotation: { condition: service_healthy }
    ports: ["127.0.0.1:18104:8104"]
    environment:
      <<: *dotnet-env
      ASPNETCORE_URLS: http://+:8104
      ConnectionStrings__AnnotationDb: Host=db-annotation;Port=5432;Database=annotation_db;Username=annotation_user;Password=${DB_ANNOTATION_PASSWORD:?chay python deploy/tao_env.py};Maximum Pool Size=10

  ledger:
    <<: *dotnet-service
    image: datn/ledger:demo
    container_name: datn-demo-ledger
    build: { context: ., dockerfile: deploy/docker/dotnet.Dockerfile, args: { APP: Crowd.Ledger.Api } }
    depends_on:
      rabbitmq: { condition: service_healthy }
      db-ledger: { condition: service_healthy }
    environment:
      <<: *dotnet-env
      ASPNETCORE_URLS: http://+:8105
      InternalApi__IdentityUrl: http://identity:8101
      ConnectionStrings__LedgerDb: Host=db-ledger;Port=5432;Database=ledger_db;Username=ledger_user;Password=${DB_LEDGER_PASSWORD:?chay python deploy/tao_env.py};Maximum Pool Size=20

  payment:
    <<: *dotnet-service
    image: datn/payment:demo
    container_name: datn-demo-payment
    build: { context: ., dockerfile: deploy/docker/dotnet.Dockerfile, args: { APP: Crowd.Payment.Api } }
    depends_on:
      rabbitmq: { condition: service_healthy }
      db-payment: { condition: service_healthy }
    environment:
      <<: *dotnet-env
      ASPNETCORE_URLS: http://+:8106
      ConnectionStrings__PaymentDb: Host=db-payment;Port=5432;Database=payment_db;Username=payment_user;Password=${DB_PAYMENT_PASSWORD:?chay python deploy/tao_env.py};Maximum Pool Size=10
      PaymentProviders__Sandbox__CheckoutBaseUrl: http://localhost:18080/payments/sandbox/checkout/
      PaymentProviders__Sandbox__PublicUrl: http://localhost:18080
      ForwardedHeaders__TrustedNetworks__0: 10.88.0.0/24
      # VNPay / MoMo GIA LAP (cong that: doi PayUrl / ApiUrl + khoa merchant qua bien moi truong).
      PaymentProviders__VnPay__PayUrl: http://localhost:18080/payments/sandbox/vnpay/pay
      PaymentProviders__VnPay__ApiUrl: http://payment:8106/payments/sandbox/vnpay/api
      PaymentProviders__VnPay__IpnUrl: http://payment:8106/payments/webhooks/vnpay
      PaymentProviders__MoMo__ApiUrl: http://payment:8106/payments/sandbox/momo
      PaymentProviders__MoMo__IpnUrl: http://payment:8106/payments/webhooks/momo

  link:
    <<: *dotnet-service
    image: datn/link:demo
    container_name: datn-demo-link
    build: { context: ., dockerfile: deploy/docker/dotnet.Dockerfile, args: { APP: Crowd.Link.Api } }
    depends_on:
      rabbitmq: { condition: service_healthy }
      db-link: { condition: service_healthy }
    ports: ["127.0.0.1:18107:8107"]
    environment:
      <<: *dotnet-env
      ASPNETCORE_URLS: http://+:8107
      ConnectionStrings__LinkDb: Host=db-link;Port=5432;Database=link_db;Username=link_user;Password=${DB_LINK_PASSWORD:?chay python deploy/tao_env.py};Maximum Pool Size=10
      Links__ShortBaseUrl: http://localhost:5173/g/
      ForwardedHeaders__TrustedNetworks__0: 10.88.0.0/24

  gate:
    <<: *dotnet-service
    image: datn/gate:demo
    container_name: datn-demo-gate
    build: { context: ., dockerfile: deploy/docker/dotnet.Dockerfile, args: { APP: Crowd.Gate.Api } }
    depends_on:
      rabbitmq: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      db-gate: { condition: service_healthy }
      redis-gate: { condition: service_healthy }
      ch-gate: { condition: service_healthy }
    ports: ["127.0.0.1:18108:8108"]
    environment:
      <<: *dotnet-env
      ASPNETCORE_URLS: http://+:8108
      ConnectionStrings__GateDb: Host=db-gate;Port=5432;Database=gate_db;Username=gate_user;Password=${DB_GATE_PASSWORD:?chay python deploy/tao_env.py};Maximum Pool Size=10
      Gate__Redis: redis-gate:6379
      Gate__ClickHouse: Host=ch-gate;Port=8123;Username=gate_user;Password=${DB_GATE_PASSWORD:?chay python deploy/tao_env.py};Database=gate_db
      ForwardedHeaders__TrustedNetworks__0: 10.88.0.0/24

  quality:
    image: datn/quality:demo
    container_name: datn-demo-quality
    restart: unless-stopped
    build: { context: ., dockerfile: deploy/docker/quality.Dockerfile }
    depends_on:
      rabbitmq: { condition: service_healthy }
      db-quality: { condition: service_healthy }
    environment:
      QUALITY_DATABASE_URL: postgresql+asyncpg://quality_user:${DB_QUALITY_PASSWORD:?chay python deploy/tao_env.py}@db-quality:5432/quality_db
      QUALITY_RABBIT_PASSWORD: ${RABBIT_PASSWORD:?chay python deploy/tao_env.py}
      QUALITY_RABBIT_HOST: rabbitmq
      QUALITY_JWKS_URL: http://identity:8101/.well-known/jwks.json
      QUALITY_PROJECT_URL: http://project:8102
      QUALITY_INTERNAL_API_KEY: ${INTERNAL_API_KEY:?chay python deploy/tao_env.py}
      # Cham cau tra loi mo theo nghia (3.19). ml-svc sap → quality-svc cho roi ha xuong so chu.
      QUALITY_ML_URL: http://ml:8202

  ml:
    # AI ho tro (3.19): nhung cau tra loi mo cho quality-svc. Chi trong mang noi bo, khong qua gateway.
    image: datn/ml:demo
    container_name: datn-demo-ml
    restart: unless-stopped
    build: { context: ., dockerfile: deploy/docker/ml.Dockerfile }
    depends_on:
      db-ml: { condition: service_healthy }
    environment:
      ML_DATABASE_URL: postgresql+asyncpg://ml_user:${DB_ML_PASSWORD:?chay python deploy/tao_env.py}@db-ml:5432/ml_db
      ML_INTERNAL_API_KEY: ${INTERNAL_API_KEY:?chay python deploy/tao_env.py}

  media:
    # Bao ve du lieu (FP-02, FP-03): phat file mau qua token, watermark chim nhung thang nguoi xem. Khong co DB.
    image: datn/media:demo
    container_name: datn-demo-media
    restart: unless-stopped
    build: { context: ., dockerfile: deploy/docker/media.Dockerfile }
    depends_on:
      rabbitmq: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    environment:
      MEDIA_RABBIT_HOST: rabbitmq
      MEDIA_RABBIT_PASSWORD: ${RABBIT_PASSWORD:?chay python deploy/tao_env.py}
      MEDIA_JWKS_URL: http://identity:8101/.well-known/jwks.json
      MEDIA_MINIO_ENDPOINT: minio:9000
      MEDIA_MINIO_SECRET_KEY: ${MINIO_PASSWORD:?chay python deploy/tao_env.py}
      MEDIA_GRANT_KEY: ${MEDIA_GRANT_KEY:?chay python deploy/tao_env.py}
      MEDIA_WATERMARK_KEY: ${MEDIA_WATERMARK_KEY:?chay python deploy/tao_env.py}
      # Bo dem ban chuan / ban da nhung watermark cua am thanh, video: volume rieng, tao lai container khong mat.
      MEDIA_AV_CACHE_DIR: /var/cache/media-wm
    volumes: [media-cache:/var/cache/media-wm]

  gateway:
    <<: *dotnet-service
    image: datn/gateway:demo
    container_name: datn-demo-gateway
    build: { context: ., dockerfile: deploy/docker/dotnet.Dockerfile, args: { APP: Crowd.Gateway.Api } }
    depends_on:
      rabbitmq: { condition: service_healthy }
      redis-gateway: { condition: service_healthy }
    ports: ["18080:8080"]
    environment:
      <<: *dotnet-env
      ASPNETCORE_URLS: http://+:8080
      # ocelot.json ghi localhost:<cong>; trong compose moi cong la mot host (xem DownstreamHosts).
      # Nap lai moc thu hoi phien luc khoi dong (VD-S-11).
      SessionRevocation__IdentityUrl: http://identity:8101
      ConnectionStrings__GatewayRedis: redis-gateway:6379
      DownstreamHosts__8101: identity
      DownstreamHosts__8102: project
      DownstreamHosts__8103: task
      DownstreamHosts__8104: annotation
      DownstreamHosts__8105: ledger
      DownstreamHosts__8106: payment
      DownstreamHosts__8107: link
      DownstreamHosts__8108: gate
      DownstreamHosts__8110: notification
      DownstreamHosts__8111: admin
      DownstreamHosts__8201: quality
      DownstreamHosts__8109: media
      Cors__AllowedOrigins__0: http://localhost:3000
      Cors__AllowedOrigins__1: http://localhost:5173

