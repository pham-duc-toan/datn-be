# CI: moi push / pull request
#   1. unit  — build + unit test .NET va Python (nhanh, chay truoc)
#      tla   — TLC kiem mo hinh TLA+ dong tien (song song voi unit)
#   2. e2e   — dung CA he thong bang docker-compose.demo.yml tren may sach, cho seed xong,
#              chay toan bo bo E2E (tests/e2e/chay_hoi_quy.py). Loi thi tai log moi container.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build + unit test .NET
        run: dotnet test datn.slnx -c Release

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/quality/requirements.txt

      - name: Unit test quality-svc (Python)
        working-directory: services/quality
        run: |
          pip install -r requirements.txt
          python -m pytest -q

  tla:
    # NC-B-01: kiem mo hinh TLA+ cua dong tien + dong du an. Ban dung phai khong vi pham;
    # moi bien the loi phai bi TLC bat dung bat bien (mo hinh khong "dung vi qua long").
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: TLC — moi bien the
        run: python spec/tla/chay_tlc.py

      - name: Tai ket qua TLC
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tla-ket-qua
          path: spec/tla/ket-qua/*.txt
          if-no-files-found: ignore

  e2e:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      E2E_PROFILE: demo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cai ffmpeg (e2e_modality sinh anh / am thanh / video mau)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Dung ca he thong (docker compose)
        run: docker compose -f docker-compose.demo.yml up -d --build

      - name: Cho seed xong
        run: |
          pip install -r tests/e2e/requirements.txt
          python tests/e2e/cho_san_sang.py 900

      - name: Chay toan bo E2E
        run: python tests/e2e/chay_hoi_quy.py

      - name: Gom log khi loi
        if: failure()
        run: |
          mkdir -p ci-logs
          for c in $(docker compose -f docker-compose.demo.yml ps -a --format '{{.Name}}'); do
            docker logs "$c" > "ci-logs/$c.log" 2>&1 || true
          done

      - name: Tai ket qua E2E + log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ket-qua
          path: |
            tests/e2e/ket-qua/
            ci-logs/
          if-no-files-found: ignore

      - name: Don dep
        if: always()
        run: docker compose -f docker-compose.demo.yml down -v
